<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Xindelabs</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/config.js"></script>
  <script src="js/affiliate.js"></script>
  <link rel="stylesheet" href="./css/theme.css">
</head>
<body class="bg-[#050b07] text-white min-h-screen">
  <header class="border-b border-white/10">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="text-lg font-semibold tracking-tight">XINDELABS</a>
      <div class="text-sm text-white/60 font-mono">Secure Checkout</div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-10">
    <div class="mb-8">
      <div class="funnel-eyebrow">CHECKOUT</div>
      <h1 class="funnel-h1" style="font-size:2.25rem">Selesaikan Pembayaranmu</h1>
    </div>
    <div id="checkout-app" class="co-checkout-host"></div>
  </main>

  <footer class="border-t border-white/10 mt-12">
    <div class="max-w-4xl mx-auto px-4 py-6 text-sm text-white/40">
      Butuh bantuan? Hubungi tim kami via WhatsApp.
    </div>
  </footer>

  <script type="module">
    import { supabase } from './js/config/supabase-client.js';
    import { renderCheckout, trackCheckoutStage, redirectAfterCheckout } from './js/modules/checkout.js';

    const params = new URLSearchParams(location.search);
    const funnelSlug = params.get('funnel') || 'default';

    // Load funnel (untuk tier list + webhook url + thank you/upsell)
    let funnel = { slug: funnelSlug, subdomain: funnelSlug, settings: {}, _steps: [] };
    try {
      const { data } = await supabase
        .from('funnels')
        .select('*')
        .or(`slug.eq.${funnelSlug},subdomain.eq.${funnelSlug}`)
        .eq('is_active', true)
        .maybeSingle();
      if (data) funnel = data;
      if (data) {
        const { data: steps } = await supabase
          .from('funnel_steps')
          .select('*')
          .eq('funnel_id', data.id)
          .eq('is_active', true)
          .order('sort', { ascending: true });
        funnel._steps = steps || [];
      }
    } catch (e) {
      console.warn('Gagal memuat funnel:', e);
    }

    const tier = {
      id: params.get('tier') || 'default',
      name: params.get('tier_name') || '',
      price: Number(params.get('tier_price') || 0)
    };

    const app = document.getElementById('checkout-app');

    // Tidak ada tier & tidak ada funnel aktif -> arahkan ke beranda
    const hasTiers = (funnel._steps || []).some(
      (s) => (s.blocks || []).some((b) => b.type === 'pricing' && b.data && Array.isArray(b.data.tiers) && b.data.tiers.length)
    );
    if (!params.get('tier') && !hasTiers) {
      app.innerHTML = `
        <div class="funnel-empty" style="padding:3rem 0">
          <h2 style="font-size:1.5rem;font-weight:700;margin-bottom:0.75rem">Belum ada paket dipilih</h2>
          <p style="color:rgba(255,255,255,0.55);margin-bottom:1.5rem">Silakan pilih paket dari halaman penawaran terlebih dahulu.</p>
          <a href="/" class="co-btn co-btn--primary">Kembali ke Beranda</a>
        </div>
      `;
    } else {
      trackCheckoutStage(funnel, tier);

      renderCheckout(app, {
        funnel,
        tier,
        onSuccess: (result) => redirectAfterCheckout(result, funnel)
      });
    }

    function showVoucherResult(msg, isErr) {
      voucherResult.innerHTML = msg;
      voucherResult.className = 'voucher-result ' + (isErr ? 'voucher-result--err' : 'voucher-result--ok');
      voucherResult.style.display = 'flex';
      voucherHint.style.display = 'none';
    }

    // ---------- Validasi ----------
    function validators() {
      return {
        nama: function (v) { return v.trim().length >= 2; },
        email: function (v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()); },
        wa: function (v) {
          var s = v.replace(/\D/g, '');
          var local = /^08\d{7,}$/.test(s);
          var intl = /^628\d{7,}$/.test(s);
          return local || intl;
        },
        discord: function (v) {
          var s = v.replace(/\D/g, '');
          // Snowflake Discord = 17 digit (2015) s/d 20 digit (masa depan)
          return s.length >= 17 && s.length <= 20;
        }
      };
    }

    function validate() {
      var v = validators();
      var ok = true;
      Object.keys(v).forEach(function (name) {
        var field = form.querySelector('[data-field="' + name + '"]');
        var input = field.querySelector('input');
        var pass = v[name](input.value);
        field.classList.toggle('invalid', !pass);
        if (!pass) ok = false;
      });
      return ok;
    }

    form.querySelectorAll('input').forEach(function (inp) {
      inp.addEventListener('input', function () {
        this.closest('.field').classList.remove('invalid');
      });
    });

    // ---------- Submit → POST n8n webhook ----------
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!validate()) {
        formError.classList.add('show');
        formError.textContent = '⚠️ Cek lagi isian yang merah, ya.';
        return;
      }
      formError.classList.remove('show');

      var tier = selectedTier().value;
      var base = cfg.PRICES[tier].harga;
      var diskon = calcDiskon(tier, appliedVoucher);
      var hargaFinal = Math.max(1000, base - diskon);

      var payload = {
        nama: document.getElementById('nama').value.trim(),
        email: document.getElementById('email').value.trim(),
        wa: document.getElementById('wa').value.trim(),
        discord: document.getElementById('discord').value.trim(),
        produk: cfg.PRODUCT_KEY,
        tier: tier,
        harga: hargaFinal,
        harga_awal: base,
        diskon: diskon,
        voucher_code: appliedVoucher ? appliedVoucher.code : ''
      };

      fbq('track', 'AddPaymentInfo');
      payBtn.disabled = true;
      payBtn.textContent = 'Mengarahkan ke pembayaran…';

      // Lead disimpan OLEH n8n (workflow create-payment) — jangan insert dari sini.
      // Dulu dua-duanya jalan sehingga 1 orang bisa menghasilkan 2 baris di tabel leads.

      fetch(cfg.N8N_WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
        .then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (body) {
            if (!res.ok) {
              var e = new Error('HTTP ' + res.status);
              // n8n kirim { message } saat workflow gagal (mis. VOUCHER_DITOLAK: ...)
              var m = (body && body.message) || '';
              if (!res.ok && m) e.serverReason = m;
              throw e;
            }
            return body;
          });
        })
        .then(function (data) {
          // Server hitung ulang voucher (anti-hack). Kalau ditolak, blok checkout
          // — harga di browser jangan dipercaya. Kirim voucher_code, server validasi.
          if (data.voucher_valid === false) {
            var why = data.voucher_reason || 'Voucher tidak valid untuk paket ini.';
            appliedVoucher = null;
            updatePrice();
            showVoucherResult('⚠️ ' + why, true);
            payBtn.disabled = false;
            payBtn.textContent = 'Bayar & Daftar → ' + fmtRp(hargaFinal);
            return;
          }
          var url = data.payment_url;
          if (!url) throw new Error('payment_url tidak ada');
          window.location.href = url;
        })
        .catch(function (err) {
          payBtn.disabled = false;
          payBtn.textContent = 'Bayar & Daftar → ' + fmtRp(hargaFinal);
          formError.classList.add('show');
          // Server menolak (mis. voucher tidak berlaku utk paket ini) -> tampilkan alasannya
          var msg = (err && err.serverReason) ? err.serverReason : 'Gagal terhubung ke sistem pembayaran. Coba lagi beberapa saat.';
          formError.textContent = '⚠️ ' + msg;
        });
    });

    // ============ Load promo banner from CMS ============
    (function () {
      var cfg = window.XINDE;
      if (!cfg || !cfg.supabaseConfigured() || !window.supabase) return;
      fetch(cfg.SUPABASE_URL + '/rest/v1/site_content?key=eq.homepage&select=value', {
        headers: { 'apikey': cfg.SUPABASE_ANON_KEY }
      }).then(function (r) { return r.json(); }).then(function (rows) {
        var v = (rows && rows[0] && rows[0].value) ? rows[0].value : {};
        if (v.promo_banner_url) {
          var wrap = document.getElementById('promoBannerCheckout');
          var img = document.getElementById('promoBannerCheckoutImg');
          if (wrap && img) {
            img.src = v.promo_banner_url;
            img.alt = v.promo_banner_alt || 'Banner promo';
            wrap.style.display = 'block';
          }
        }
      }).catch(function () {});
    })();
  </script>
</body>
</html>
