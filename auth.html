<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Akses Member — xindelabs.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #040b08;
    --bg-2: #081410;
    --bg-3: #0b1a14;
    --bg-glass: rgba(4, 11, 8, 0.8);
    --green: #00ff88;
    --green-dim: rgba(0, 255, 136, 0.12);
    --green-glow: rgba(0, 255, 136, 0.22);
    --cyan: #00e5ff;
    --gold: #ffd60a;
    --danger: #ff5c7a;
    --line: rgba(234, 255, 245, 0.08);
    --line-strong: rgba(0, 255, 136, 0.3);
    --text: #eafff5;
    --muted: #8fb8a3;
    --muted-dim: #5f8070;
    --radius: 14px;
    --radius-sm: 10px;
    --font-display: "Space Grotesk", "SF Pro Display", -apple-system, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
    --font-serif: "Instrument Serif", Georgia, serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { min-height: 100%; }

  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 70% 50% at 50% -10%, rgba(0, 255, 136, 0.14), transparent 70%),
      radial-gradient(circle at 88% 16%, rgba(0, 229, 255, 0.06), transparent 45%);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 20px;
  }

  .card {
    width: 100%;
    max-width: 428px;
    background: linear-gradient(168deg, var(--bg-2), var(--bg-3));
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 34px 30px 30px;
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.62), 0 0 46px rgba(0, 255, 136, 0.07);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; top: -80px; right: -70px;
    width: 250px; height: 250px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 255, 136, 0.15), transparent 68%);
    filter: blur(26px); pointer-events: none;
  }

  .brand {
    display: flex; align-items: center; gap: 11px;
    font-family: var(--font-display); font-weight: 700;
    font-size: 1.3rem; letter-spacing: -0.03em; margin-bottom: 24px;
    position: relative; z-index: 1;
  }
  .brand .dot { color: var(--green); text-shadow: 0 0 12px rgba(0, 255, 136, 0.55); }

  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 0.68rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--green); background: var(--green-dim);
    border: 1px solid var(--line-strong);
    padding: 5px 11px; border-radius: 999px;
    margin-bottom: 16px; position: relative; z-index: 1;
  }
  .badge i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 10px var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(1.5rem, 5vw, 1.85rem);
    font-weight: 700; line-height: 1.16; letter-spacing: -0.028em;
    margin-bottom: 10px; position: relative; z-index: 1;
  }
  h1 em {
    font-family: var(--font-serif); font-style: italic; font-weight: 400;
    color: var(--green); font-size: 1.08em;
  }

  .sub {
    color: var(--muted); font-size: 0.92rem; margin-bottom: 24px;
    position: relative; z-index: 1;
  }

  label {
    display: block;
    font-family: var(--font-mono); font-size: 0.7rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted-dim); margin-bottom: 7px;
  }

  input {
    width: 100%;
    background: rgba(2, 6, 4, 0.75);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 13px 15px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  input::placeholder { color: var(--muted-dim); }
  input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.12);
  }

  .field { margin-bottom: 16px; position: relative; z-index: 1; }

  .wrap-code { position: relative; }
  .wrap-code input { padding-right: 58px; }
  .toggle-code {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: transparent; border: none; color: var(--muted-dim);
    font-family: var(--font-mono); font-size: 0.66rem; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 7px 9px; cursor: pointer; border-radius: 7px;
    transition: color 0.16s ease;
  }
  .toggle-code:hover { color: var(--green); }

  .btn {
    width: 100%;
    background: var(--green); color: var(--bg);
    font-family: var(--font-display); font-weight: 700; font-size: 0.95rem;
    border: none; border-radius: 11px;
    padding: 14px 18px; cursor: pointer;
    margin-top: 6px;
    box-shadow: 0 8px 28px rgba(0, 255, 136, 0.2);
    transition: transform 0.16s ease, background 0.16s ease;
    position: relative; z-index: 1;
  }
  .btn:hover { transform: translateY(-1px); background: #1aff95; }
  .btn:active { transform: translateY(0); }

  .err {
    background: rgba(255, 92, 122, 0.1);
    border: 1px solid rgba(255, 92, 122, 0.32);
    border-left: 3px solid var(--danger);
    color: #ffc3ce;
    font-size: 0.86rem;
    padding: 11px 14px; border-radius: var(--radius-sm);
    margin-bottom: 18px;
    position: relative; z-index: 1;
  }

  .help {
    font-size: 0.82rem; color: var(--muted-dim);
    margin-top: 20px; padding-top: 18px;
    border-top: 1px solid var(--line);
    position: relative; z-index: 1;
  }
  .help a { color: var(--green); text-decoration: none; }
  .help a:hover { text-decoration: underline; }

  .foot {
    font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted-dim);
    text-align: center; margin-top: 18px;
    position: relative; z-index: 1;
  }

  @media (max-width: 420px) {
    .card { padding: 28px 22px 24px; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">xindelabs<span class="dot">.</span></div>

    <div class="badge"><i></i> Akses Member</div>

    <h1>Halaman ini cuma<br />buat yang udah <em>beli</em>.</h1>
    <p class="sub">Masukin email yang kamu pakai pas checkout, plus kode akses yang dikirim ke email kamu.</p>

    <div class="err" id="err" hidden></div>

    <form method="POST" action="/api/login" id="form">
      <input type="hidden" name="next" id="next-field" value="" />

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email"
               placeholder="nama@email.com" required autofocus />
      </div>

      <div class="field">
        <label for="code">Kode Akses</label>
        <div class="wrap-code">
          <input id="code" name="code" type="password" autocomplete="current-password"
                 placeholder="••••••••••" required />
          <button type="button" class="toggle-code" id="toggle">Lihat</button>
        </div>
      </div>

      <button class="btn" type="submit">Masuk →</button>
    </form>

    <p class="help">
      Belum punya akses? <a href="https://xindelabs-workshop.vercel.app/preorder" target="_blank" rel="noopener">Ambil workshop-nya di sini ↗</a>
    </p>
    <p class="foot">xindelabs. — belajar bikin AI agent sendiri</p>
  </main>

  <script>
    (function () {
      var box = document.getElementById('err');
      var q = new URLSearchParams(location.search);
      var e = q.get('e') || '';
      if (e && e.trim()) { box.textContent = e; box.hidden = false; }
      var n = document.getElementById('next-field').value || q.get('next') || '';
      // Cuma izinkan path relatif — cegah open-redirect.
      if (n.charAt(0) === '/' && n.charAt(1) !== '/') {
        document.getElementById('next-field').value = n;
      }
    })();

    // Toggle lihat/sembunyikan kode akses.
    (function () {
      var btn = document.getElementById('toggle');
      var inp = document.getElementById('code');
      btn.addEventListener('click', function () {
        var show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        btn.textContent = show ? 'Sembunyi' : 'Lihat';
      });
    })();
  </script>
</body>
</html>
