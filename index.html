<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Bangun Hermes Agent Lo — Asisten AI Sesuai Kebutuhan Lo, Tanpa Coding</title>
  <meta name="description" id="pageDesc" content="Course praktis bikin AI Agent sendiri (Hermes Agent): belajar fundamental cara ngomong ke AI, loop engineering, sampai hubungkan ke channel kerja lo — buat follow-up sales, konten, customer care, rekap laporan — sesuai kebutuhan lo, tanpa coding." />
  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#040b08" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/config.js"></script>
  <script src="js/pixel.js"></script>
</head>
<body>

  <!-- ============ COUNTDOWN TIMER (sticky) ============ -->
  <div class="timer-sticky" id="timerSticky" style="display:none">
    <span class="timer-sticky__dot"></span>
    <span class="timer-sticky__label">Promo berakhir dalam</span>
    <span class="timer__countdown">--:--:--</span>
  </div>

  <!-- ============ SALES NOTIFICATION ============ -->
  <div class="sales-notif" id="salesNotif">
    <div class="notif__icon">🛒</div>
    <div class="notif__body">
      <span class="notif__name">—</span>
      <span class="notif__city">—</span>
      <span class="notif__time">—</span>
    </div>
  </div>

  <!-- ============ NAV (render dari meta) ============ -->
  <div id="lpNav"></div>

  <main id="lpRoot"></main>

  <div id="lpFooter"></div>

  <script src="js/lp-render.js"></script>
  <script src="js/landing-pages.js"></script>
  <script>
    window.__LP_MODE = true;
    var cfg = window.XINDE;
    var defaults = cfg.DEFAULT_LANDING || { meta: {}, sections: [] };
    var R = window.LPRender;
    var IS_PREVIEW = new URLSearchParams(location.search).get('preview') === '1';

    function applyAccent(accent) {
      if (!accent) return;
      var st = document.createElement('style');
      st.textContent = ':root{--green:' + accent + '}.hl{color:' + accent + '}';
      document.head.appendChild(st);
    }

    // ============ Helper form leads ============
    function normPhone(p) {
      var d = String(p).replace(/[^\d]/g, '');
      if (!d) return '';
      if (d[0] === '0') d = '62' + d.slice(1);
      else if (d[0] !== '6' && d[0] !== '9') d = '62' + d;
      return d;
    }
    function markInvalid(field) {
      field.closest('.field').classList.add('invalid');
      field.addEventListener('input', function () { field.closest('.field').classList.remove('invalid'); }, { once: true });
    }
    function saveLead(payload, onDone, onFail) {
      if (!cfg.supabaseConfigured() || !window.supabase) { onDone(); return; }
      var client = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
      client.from('leads').insert(payload).then(function (r) {
        if (r.error) return onFail('Gagal simpan data: ' + (r.error.message || 'coba lagi'));
        onDone();
      }).catch(function () { onFail(); });
    }

    function buildPage(content) {
      var ctx = R.makeContext(content.meta);
      applyAccent(ctx.accent);

      if (content.meta && content.meta.page_title) {
        document.title = content.meta.page_title;
        var d = document.getElementById('pageDesc');
        if (d && content.meta.page_desc) d.setAttribute('content', content.meta.page_desc);
      }

      var contentOut = R.prepare(content);
      document.getElementById('lpNav').innerHTML = R.renderNav(contentOut.meta, ctx);
      document.getElementById('lpRoot').innerHTML = R.renderSections(contentOut, ctx);
      document.getElementById('lpFooter').innerHTML = R.renderFooter(contentOut.meta, ctx);
      bindPage();
    }

    function bindPage() {
      // Reveal on scroll
      var rev = document.getElementById('lpRoot').querySelectorAll('.reveal');
      if ('IntersectionObserver' in window && rev.length) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
          });
        }, { threshold: 0.1 });
        rev.forEach(function (el) { io.observe(el); });
      }

      // Hamburger
      var burger = document.getElementById('hamburger');
      if (burger) burger.onclick = function () { document.getElementById('navLinks').classList.toggle('open'); };
    }

    // ============ Event delegation (render ulang aman) ============
    document.addEventListener('click', function (e) {
      // FAQ accordion
      var btn = e.target.closest('.faq__q');
      if (btn) {
        var item = btn.closest('.faq__item');
        if (item) item.classList.toggle('open');
        return;
      }
    });

    // ============ Form Komunitas Gratis → tabel leads (source: komunitas) ============
    document.addEventListener('submit', function (e) {
      var form = e.target;
      if (!form || form.id !== 'commForm') return;
      e.preventDefault();
      var name = document.getElementById('commName').value.trim();
      var email = document.getElementById('commEmail').value.trim();
      var phoneRaw = document.getElementById('commWhatsapp').value.trim();
      var btn = document.getElementById('commSubmit');
      var err = document.getElementById('commError');

      var ok = true;
      if (!name) { markInvalid(document.getElementById('commName')); ok = false; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { markInvalid(document.getElementById('commEmail')); ok = false; }
      if (!normPhone(phoneRaw)) { markInvalid(document.getElementById('commWhatsapp')); ok = false; }
      if (!ok) return;

      err.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Mengirim…';

      var done = function () {
        document.getElementById('commDoneName').textContent = name;
        form.style.display = 'none';
        document.getElementById('commDone').style.display = 'block';
      };
      var fail = function (msg) {
        btn.disabled = false;
        btn.textContent = 'Gabung Gratis →';
        err.textContent = '⚠️ ' + (msg || 'Gagal daftar, coba lagi.');
        err.classList.add('show');
      };

      saveLead({
        name: name,
        email: email,
        whatsapp: normPhone(phoneRaw),
        status: 'belum',
        source: 'komunitas'
      }, done, fail);
    });

    // ============ Preview mode (embedded di admin) ============
    function embeddedReceive(e) {
      if (!e.data || e.data.type !== 'lp-draft') return;
      buildPage(e.data.content || { meta: {}, sections: [] });
    }

    // ============ Load landing utama ============
    (function () {
      if (IS_PREVIEW) {
        window.addEventListener('message', embeddedReceive);
        setTimeout(function () {
          if (!document.getElementById('lpRoot').innerHTML) {
            buildPage({ meta: defaults.meta, sections: defaults.sections });
          }
        }, 1500);
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'lp-ready', href: location.href }, '*');
        }
        return;
      }

      if (!cfg.supabaseConfigured()) { buildPage(defaults); return; }

      fetch(cfg.SUPABASE_URL + '/rest/v1/site_content?key=eq.homepage&select=value', {
        headers: { 'apikey': cfg.SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + cfg.SUPABASE_ANON_KEY }
      }).then(function (r) { return r.json(); }).then(function (rows) {
        var v = (rows && rows[0] && rows[0].value) ? rows[0].value : null;
        var meta = Object.assign({}, defaults.meta, (v && v.meta) || {});
        var sections = (v && Array.isArray(v.sections) && v.sections.length) ? v.sections : defaults.sections;
        buildPage({ meta: meta, sections: sections });
      }).catch(function () { buildPage(defaults); });
    })();
  </script>
  <script src="js/countdown.js"></script>
  <script src="js/notif.js"></script>
</body>
</html>
